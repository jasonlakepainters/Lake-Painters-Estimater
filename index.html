put type="number" min="0" step="1" value="${esc(r.doorSides??0)}" oninput="updateSurface(${i},'doorSides',this.value)"><p><small>One face = one side; painting both faces of one door = 2 sides. Door casing remains in trim linear feet.</small></p><label>Scope / window trim / ceilings / primer notes</label><textarea oninput="updateSurface(${i},'scope',this.value)">${esc(r.scope)}</textarea><p id="area-${i}"><strong>Net wall area: ${area(r).toFixed(1)} sq ft</strong></p><button class="secondary" onclick="d.rooms.splice(${i},1);save();render()">Remove section</button></div>`).join('');
if(step===3)h=`<div class="card"><h2>Paint specifications</h2><p>Select the paint being considered for this project. Confirm the exact product, finish, and compatibility before ordering.</p><h3>Paint and materials</h3><label>Paint brand</label><select onchange="changePaintBrand(this.value)">${paintBrands.map(b=>`<option value="${esc(b)}" ${d.paintBrand===b?'selected':''}>${esc(b)}</option>`).join('')}</select><label>Interior or exterior paint</label><select onchange="changePaintUse(this.value)"><option ${d.paintUse==='Interior'?'selected':''}>Interior</option><option ${d.paintUse==='Exterior'?'selected':''}>Exterior</option><option ${d.paintUse==='Deck'?'selected':''}>Deck</option></select><label>Paint product / line</label><select onchange="changePaintProduct(this.value)"><option value="">Select paint line</option>${selectedPaintProducts().map(p=>`<option ${d.paintProduct===p?'selected':''}>${esc(p)}</option>`).join('')}</select><label>Other / custom product (optional)</label><input type="text" value="${esc(d.paintProduct||'')}" placeholder="Enter or adjust product name" oninput="d.paintProduct=this.value;save()"><label>Paint sheen</label><select onchange="changePaintSheen(this.value)"><option value="">Select sheen</option>${paintSheens.map(p=>`<option ${d.paintSheen===p?'selected':''}>${esc(p)}</option>`).join('')}</select><label>Other / custom sheen (optional)</label><input type="text" value="${esc(d.paintSheen||'')}" placeholder="Enter or adjust sheen" oninput="d.paintSheen=this.value;save()"><h3>Application method and coverage</h3><label>How will this paint be applied?</label><select onchange="d.applicationMethod=this.value;save();render()"><option value="Brush and roll" ${d.applicationMethod==='Brush and roll'?'selected':''}>Brush and roll</option><option value="Spray" ${d.applicationMethod==='Spray'?'selected':''}>Spray</option><option value="Combination" ${d.applicationMethod==='Combination'?'selected':''}>Combination: spray and brush/roll</option></select>< if(step===4&&d.project==='Exterior')h=`<div class="card"><h2>Exterior cleaning and access</h2><p>Capture cleaning and access requirements before pricing. Add corresponding labor tasks below only when they are not already included.</p><label>Power / pressure washing required?</label><select onchange="d.pressureWashing=this.value;save()">${['','Yes','No','Partial / spot cleaning'].map(v=>`<option value="${v}" ${(d.pressureWashing||'')===v?'selected':''}>${v||'Select'}</option>`).join('')}</select><div class="row"><div><label>Area to wash (sq ft)</label><input type="number" min="0" step="any" value="${esc(d.washingArea??'')}" oninput="d.washingArea=this.value;save()"></div><div><label>Approximate working height (ft)</label><input type="number" min="0" step="any" value="${esc(d.exteriorWorkHeight??'')}" oninput="d.exteriorWorkHeight=this.value;save()"></div></div><label>Washing method</label><select onchange="d.washingMethod=this.value;save()">${['','Low-pressure / soft wash','Pressure wash','Hand clean','Mixed methods'].map(v=>`<option value="${v}" ${(d.washingMethod||'')===v?'selected':''}>${v||'Select'}</option>`).join('')}</select><label>Access equipment</label><select onchange="d.accessEquipment=this.value;save()">${['','Ground level','Step ladder','Extension ladder','Scaffolding','Aerial lift','Multiple / other'].map(v=>`<option value="${v}" ${(d.accessEquipment||'')===v?'selected':''}>${v||'Select equipment'}</option>`).join('')}</select><label>Ladder size category</label><select onchange="d.ladderSize=this.value;save()">${['','Small','Medium','Large','Multiple sizes','Not applicable'].map(v=>`<option value="${v}" ${(d.ladderSize||'')===v?'selected':''}>${v||'Select size'}</option>`).join('')}</select><label>Actual ladder length / reach (ft, optional)</label><input type="number" min="0" step="any" value="${esc(d.ladderFeet??'')}" oninput="d.ladderFeet=this.value;save()"><label>Scaffolding / lift requirements, terrain, overhead obstacles, power lines, protection, if(step===6){let c=calc();h=inspectionCheckHTML(c)+`<div class="card"><h2>Internal preliminary estimate</h2><p><strong>${esc(d.customer||'Unnamed customer')}</strong><br>${esc(d.address)}</p><label>Pricing option</label><select onchange="d.pricingMode=this.value;d.laborRate=this.value==='separate70'?70:90;save();render()"><option value="inclusive90" ${d.pricingMode!=='separate70'?'selected':''}>$90/hour — materials included</option><option value="separate70" ${d.pricingMode==='separate70'?'selected':''}>$70/hour — materials billed separately</option></select><p><small>At $90/hour, materials are not charged again. At $70/hour, paint, primer, and sundries are added using the adjustable material multiplier. Equipment and washing are additional in both modes.</small></p><h3>Nonzero labor tasks</h3><p>${[["Walls",c.wallHours],["Soffits",c.soffitHours],["Fascia",c.fasciaHours],["Gutters",c.gutterHours],["Shutters",c.shutterHours],["Columns",c.columnHours],["Porch ceilings",c.porchHours],["Railings",c.railingHours],["Garage doors",c.garageDoorHours],["Trim",c.trimHours],["Doors",c.doorHours],["Deck spindles",c.deckSpindleHours],["Deck rails",c.deckRailHours],["Deck posts",c.deckPostHours],["Deck fascia",c.deckFasciaHours],["Deck stairs",c.deckStairHours],["Deck beams",c.deckBeamHours],["Deck details",c.deckDetailHours],["Preparation",c.prepHours],["Primer",c.primerHours]].filter(x=>x[1]>0).map(x=>x[0]+": "+x[1].toFixed(2)+" hr").join("<br>")}</p><h3>Finish paint and primer purchases</h3><p>${c.purchasePlan.filter(p=>p.containers>0).map(p=>esc((p.brand||"")+" "+(p.product||""))+": "+p.gallons.toFixed(2)+" gal needed, "+p.containers+" × "+esc(p.containerSize)+" = "+money(p.totalCost)).join("<br>")}${c.primerContainers>0?"<br>Primer "+esc(d.primerProduct||"product not specified")+": "+c.primerGallons.toFixed(2)+" gal needed, "+c.primerContainers+" × "+esc(d.primerSize)+" = "+money(c.primerCostTotal):""}</p><p>Labor: ${money(c.laborTotal)}${c.washLaborTotal>0?"<br>Pressure washing: "+money(c.washLaborTotal):""}${c.paintCostTotal>0?"<br>Paint and primer purchase cost: "+money(c.paintCostTotal):""}${c.sundryCostTotal>0?"<br>Sundries: "+money(c.sundryCostTotal):""}${c.equipmentCostTotal>0?"<br>Equipment: "+money(c.equipmentCostTotal):""}<br>Materials purchase cost: ${money(c.materialsCost)}<br>Materials after markup: ${money(c.materialsTotal)}<br>Materials billed: ${money(c.materialsBilled)}<br><strong>Preliminary price: ${money(c.price)}</strong></p>${c.unpriced.length?"<p class='notice'>Review: "+esc(c.unpriced.join("; "))+"</p>":""}<p class="notice">Internal preliminary estimate only. Amy must approve. A 1.4 multiplier means 40% markup on cost, not 40% gross margin. Materials are tracked but not added in the $90 mode.</p><h3>Jason / Amy pricing approval</h3><label>Materials markup (%)</label><input type="number" min="0" max="500" step="0.1" value="${esc(Math.round((Math.max(0,+d.markup||1)-1)*1000)/10)}" onchange="setAmyMarkup(this.value)"><p><small>Default 40% markup on material cost: $100 cost becomes $140 billed in the $70/hour mode. This is markup, not profit margin. In the $90/hour mode, materials remain included in labor pricing.</small></p><label>Jason / Amy approved selling price (optional)</label><input type="number" min="0" step="any" value="${esc(d.finalPrice)}" oninput="d.finalPrice=this.value;save()"><h3>Editable estimating assumptions</h3><div class="row">${[['wallRate','Wall sq ft/hour (2 coats)'],['deckFloorRate','Prepared deck flooring sq ft/painter-hour (2 coats)'],['soffitRate','Soffits sq ft/hour (2 coats; provisional)'],['fasciaSqftRate','Fascia sq ft/hour (2 coats; provisional)'],['gutterRate','Gutters LF/hour (2 coats; provisional fallback)'],['gutterSqftRate','Gutters sq ft/hour (2 coats; measured exposed face)'],['shutterRate','Shutters painted sq ft/hour (2 coats)'],['columnRate','Columns painted sq ft/hour (2 coats)'],['porchRate','Porch ceiling sq ft/hour (2 coats)'],['railingRate','Railings LF/hour (2 coats; // On-device sketch notes. Coordinates are stored as fractions of the drawing area,
 // so strokes survive rotation/resizing and remain part of the JSON backup.
let sketchActive=null,sketchTool='pen';
function sketchCanvas(){return document.getElementById('deck-sketch-canvas')}
function sketchDraw(){
 const cv=sketchCanvas();if(!cv)return;
 const ctx=cv.getContext('2d'),w=cv.width,h=cv.height;
 ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);
 ctx.strokeStyle='#e5edf1';ctx.lineWidth=1;
 // Each 35-pixel grid cell is one drawing foot (20 ft x 12 ft).
 for(let x=0;x<=w;x+=35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
 for(let y=0;y<=h;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
 for(const line of d.deckSketchStrokes||[]){
  const pts=line.points||[];if(!pts.length)continue;
  ctx.strokeStyle=line.tool==='eraser'?'#ffffff':'#0d405c';
  ctx.lineWidth=line.tool==='eraser'?22:3;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(pts[0][0]*w,pts[0][1]*h);
  for(const p of pts.slice(1))ctx.lineTo(p[0]*w,p[1]*h);
  if(pts.length===1)ctx.lineTo(pts[0][0]*w+.1,pts[0][1]*h+.1);
  ctx.stroke();
 }
}
function sketchPoint(event){
 const cv=sketchCanvas(),rect=cv.getBoundingClientRect();
 return [Math.max(0,Math.min(1,(event.clientX-rect.left)/rect.width)),Math.max(0,Math.min(1,(event.clientY-rect.top)/rect.height))];
}
function sketchDown(event){if(event.button!==undefined&&event.button!==0)return;
 const cv=sketchCanvas();cv.setPointerCapture(event.pointerId);sketchActive={tool:sketchTool,points:[sketchPoint(event)]};
 d.deckSketchStrokes.push(sketchActive);sketchDraw();event.preventDefault();
}
function sketchMove(event){if(!sketchActive)return;sketchActive.points.push(sketchPoint(event));sketchDraw();event.preventDefault()}
function sketchUp(event){if(!sketchActive)return;sketchActive.points.push(sketchPoint(event));sketchActive=null;save();sketchDraw();event.preventDefault()}
function sketchUndo(){d.deckSketchStrokes.pop();save();sketchDraw()}
function sketchClear(){if(!confirm('Clear this deck sketch? The section measurements will remain.'))return;d.deckSketchStrokes=[];save();sketchDraw()}
function sketchSetTool(tool){sketchTool=tool;const status=document.getElementById('deck-sketch-tool-status');if(status)status.textContent='Selected: '+(tool==='eraser'?'Eraser':'Pen')}
function sketchImage(){
 const lines=d.deckSketchStrokes||[];if(!lines.length)return '';
 const cv=document.createElement('canvas');cv.width=700;cv.height=420;
 const ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cv.width,cv.height);
 ctx.strokeStyle='#e5edf1';ctx.lineWidth=1;
 for(let x=0;x<=cv.width;x+=35){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke()}
 for(let y=0;y<=cv.height;y+=35){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke()}
 for(const line of lines){
  const pts=line.points||[];if(!pts.length)continue;
  ctx.strokeStyle=line.tool==='eraser'?'#ffffff':'#0d405c';ctx.lineWidth=line.tool==='eraser'?22:3;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(pts[0][0]*cv.width,pts[0][1]*cv.height);
  for(const p of pts.slice(1))ctx.lineTo(p[0]*cv.width,p[1]*cv.height);
  if(pts.length===1)ctx.lineTo(pts[0][0]*cv.width+.1,pts[0][1]*cv.height+.1);
  ctx.stroke();
 }
 return cv.toDataURL('image/png');
}

const JOB_STORE='lp-saved-jobs-v1';
function savedJobs(){try{const jobs=JSON.parse(localStorage.getItem(JOB_STORE)||'[]');return Array.isArray(jobs)?jobs:[]}catch(e){alert('Saved-jobs data cannot be read. Export your current inspection before proceeding.');return null}}
function hasInspection(){return Boolean((d.customer||'').trim()||(d.address||'').trim()||(d.rooms||[]).length||(d.repairs||[]).length||(d.photos||[]).length||(d.notes||'').trim()||(d.deckSketchStrokes||[]).length)}
function saveJob(quiet=false){
 if(!hasInspection()){if(!quiet)alert('Enter customer details or inspection measurements before saving a job.');return true}
 const jobs=savedJobs();if(!jobs)return false;
 if(!d.jobId)d.jobId='job-'+Date.now()+'-'+Math.random().toString(36).slice(2,9);
 const now=new Date().toISOString();d.updatedAt=now;if(!d.createdAt)d.createdAt=now;
 const record=JSON.parse(JSON.stringify(d)),idx=jobs.findIndex(x=>x.jobId===d.jobId);
 if(idx>=0)jobs[idx]=record;else jobs.unshift(record);
 try{localStorage.setItem(JOB_STORE,JSON.stringify(jobs));localStorage.setItem('lp-v1',JSON.stringify(d));localStorage.setItem('lp-step',String(step))}
 catch(e){alert('This browser is out of storage. Your job was not archived. Export a JSON backup before starting another inspection.');return false}
 if(!quiet)alert('Job saved on this device. Use Saved Jobs to reopen it. For safety, also export a JSON backup.');
 return true;
}
function showSavedJobs(){
 const jobs=savedJobs();if(!jobs)return;
 const cards=jobs.map(j=>'<div class="card"><strong>'+esc(j.customer||'Unnamed customer')+'</strong><p>'+esc(j.address||'No address')+' — '+esc(j.project||'Project')+'</p><small>Updated '+esc(j.updatedAt?new Date(j.updatedAt).toLocaleString():'Unknown')+'</small><div class="actions"><button onclick="openSavedJob('+JSON.stringify(j.jobId).replace(/"/g,'&quot;')+')">Open job</button><button class="secondary" onclick="deleteSavedJob('+JSON.stringify(j.jobId).replace(/"/g,'&quot;')+')">Delete saved copy</button></div></div>').join('');
 $('screen').innerHTML='<div class="card"><h2>Saved jobs ('+jobs.length+')</h2><p>Jobs on this device only. Not synchronized to Amy or another device. Export JSON backups regularly.</p><div class="actions"><button onclick="saveJob()">Save current job</button><button class="secondary" onclick="render()">Return to inspection</button><button class="secondary" onclick="newInspection()">New inspection</button></div></div>'+(cards||'<p>No saved jobs yet. Open an inspection and press Save Job.</p>');
 window.scrollTo(0,0);
}
function openSavedJob(id){
 const jobs=savedJobs();if(!jobs)return;const match=jobs.find(j=>j.jobId===id);if(!match)return alert('Saved job not found.');
 if(hasInspection()&&d.jobId!==id&&!saveJob(true))return;
 d={...empty(),...JSON.parse(JSON.stringify(match))};step=0;save();render();window.scrollTo(0,0);
}
function deleteSavedJob(id){
 const jobs=savedJobs();if(!jobs)return;const j=jobs.find(x=>x.jobId===id);if(!j)return;
 if(!confirm('Delete the saved copy for '+(j.customer||'this customer')+'? This cannot be undone.'))return;
 try{localStorage.setItem(JOB_STORE,JSON.stringify(jobs.filter(x=>x.jobId!==id)))}catch(e){alert('Could not update saved jobs.');return}
 // Leave active draft untouched, even if its saved copy was deleted.
 showSavedJobs();
}
function newInspection(){
 if(hasInspection()&&!saveJob(true))return;
 if(!confirm('Start a fresh inspection? The current job will remain in Saved Jobs on this device.'))return;
 d=empty();step=0;save();render();window.scrollTo(0,0);
}
function emailAmy(){
 let email='';try{email=localStorage.getItem('lp-amy-email')||''}catch(e){}
 if(!email){email=prompt("Enter Amy's email address. This will be remembered on this device:",'')||'';email=email.trim();if(!email)return;if(!email.includes('@')||!email.split('@')[1]?.includes('.')||email.includes(' ')){alert('Please enter a valid email address.');return}try{localStorage.setItem('lp-amy-email',email)}catch(e){}}
 const subject='Lake Painters internal inspection — '+(d.customer||'Customer');
 const body=report(),link='mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
 if(link.length>7000){alert('This report is too large for a reliable prefilled email. Use Share report and choose Mail to attach the full report.');shareReport();return}
 window.location.href=link;
}
function goHome(){step=0;save();render();window.scrollTo(0,0)}
function goLast(){step=steps.length-1;save();render();window.scrollTo(0,0)}
function move(n){if(step===steps.length-1&&n===1){newInspection();return}step=Math.max(0,Math.min(steps.length-1,step+n));save();render();window.scrollTo(0,0)}
function save(){try{localStorage.setItem('lp-v1',JSON.stringify(d));localStorage.setItem('lp-step',step)}catch(e){alert('Browser storage is full. Export your inspection backup and reduce photos.')} }
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportJSON(){save();const name=(d.customer||'customer').replace(/[^a-z0-9 -]/gi,'').trim().replace(/\s+/g,'-').slice(0,45)||'customer';download('lake-painters-'+name+'-'+new Date().toISOString().slice(0,10)+'-backup.json',JSON.stringify(d,null,2),'application/json')}
function printReportMode(mode){save();const w=window.open('','_blank');if(!w){alert('Please allow pop-ups to print.');return}let content=report();if(mode==='inspection')content=content.split('INTERNAL PRELIMINARY ESTIMATE')[0];let sketch=d.project==='Deck'&&sketchImage()?'<figure><h3>Deck sketch (1 grid square = 1 foot; drawn lines are approximate)</h3><img style="max-width:100%;max-height:600px" src="'+sketchImage()+'"><figcaption>Sketch labels correspond to individually measured deck sections.</figcaption></figure>':'';let photos=mode==='full'?(d.photos||[]).map(p=>'<figure><img style="max-width:100%;max-height:600px" src="'+safePhoto(p.data)+'"><figcaption>'+esc(p.caption||'')+'</figcaption></figure>').join(''):'';w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Lake Painters Report</title><style>body{font:12px Arial;margin:24px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}figure{break-inside:avoid}</style></head><body><h2>Lake Painters Report</h2><pre>'+esc(content)+'</pre>'+sketch+photos+'</body></html>');w.document.close();setTimeout(()=>{w.focus();w.print()},400)}
function printSaveBackup(){save();exportJSON();printReportMode('economy')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.rooms)||!Array.isArray(obj.repairs))throw Error('Invalid format');d={...empty(),...obj};step=0;save();render()}catch{alert('Could not read inspection backup')}};reader.readAsText(f)}
function customerReport(){return `LAKE PAINTERS — DRAFT PROJECT SCOPE\nCustomer: ${d.customer}\nProperty: ${d.address}\nProject: ${d.project}\n\nPROPOSED WORK (SUBJECT TO REVIEW)\n${d.rooms.map((r,i)=>`${i+1}. ${r.name||r.kind}: ${area(r).toFixed(1)} sq ft, ${r.coats} coats, ${r.doorSides||0} door sides. ${r.scope||''}`).join('\n')}\n\nADDITIONAL WORK TO REVIEW\n${d.repairs.map(r=>`${r.name}: ${r.qty}`).join('\n')}\n\nFinal scope and pricing require Lake Painters approval.`}
function downloadCustomerReport(){download('lake-painters-customer-scope-DRAFT.txt',customerReport(),'text/plain')}
function downloadReport(){download('lake-painters-INTERNAL-inspection.txt',report(),'text/plain')}
async function shareReport(){let blob=new Blob([report()],{type:'text/plain'});let file=new File([blob],'lake-painters-inspection.txt',{type:'text/plain'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Lake Painters inspection'});else if(navigator.share)await navigator.share({title:'Lake Painters inspection',text:report()});else downloadReport()}catch(e){if(e.name!=='AbortError')downloadReport()}}
function addPhotos(e){[...e.target.files].forEach(f=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));cv.width=im.width*scale;cv.height=im.height*scale;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);d.photos.push({caption:f.name,data:cv.toDataURL('image/jpeg',.65)});save();render()};im.src=reader.result};reader.readAsDataURL(f)})}
try{step=Math.min(5,Math.max(0,+localStorage.getItem('lp-step')||0));if(!localStorage.getItem('lp-step-seven-page-v1')){if(step>=3)step++;localStorage.setItem('lp-step-seven-page-v1','1');localStorage.setItem('lp-step',step)}}catch{}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script><script type="module" src="./firebase-sync.js"></script></body></html>
