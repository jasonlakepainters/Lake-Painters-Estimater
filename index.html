<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083b59"><link rel="manifest" href="manifest.webmanifest"><title>Lake Painters Field Estimator</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173247;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}header{background:#083b59;color:white;padding:12px 18px;display:flex;align-items:center;gap:12px}header img{width:56px;height:56px;object-fit:cover;border-radius:12px}main{max-width:750px;margin:auto;padding:20px}h1{font-size:1.35rem;margin:0}h2{font-size:1.25rem}small{color:#5c6d78}header small{color:#d8e9f1}.card{background:white;border:1px solid #dce5e8;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 5px #00000008}label{display:block;font-weight:600;margin:13px 0 5px}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #b8c7ce;border-radius:8px;background:white}textarea{min-height:76px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}button{font:inherit;padding:11px 15px;border:0;border-radius:9px;background:#0c577b;color:white;cursor:pointer}button.secondary{background:#e5edf1;color:#12364b}button:disabled{opacity:.45}.pill{background:#e9f4f9;border-radius:30px;padding:7px 12px;display:inline-block;font-size:.85rem}.hide{display:none}.notice{padding:10px;border-left:4px solid #d49a2a;background:#fff7e5}.check{display:flex;align-items:center;gap:9px;margin:10px 0}.check input{width:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.9rem}.progress{height:7px;background:#dce5e8;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#1c8eab;transition:width .2s}@media print{header,.actions,.no-print,.progress{display:none!important}main{max-width:none}.card{box-shadow:none;break-inside:avoid}body{background:white}}
</style></head><body><header><img src="logo.jpg" alt="Lake Painters official logo"><div><h1>Lake Painters</h1><small>Field Estimator · Prototype v1</small></div></header><main>
<div class="notice no-print">Prototype: saves data in this browser only. Export a backup before clearing browser data. No AI, accounts, or Jobber connection yet. Preliminary pricing is internal only.</div>
<div class="card no-print"><div class="progress"><div id="bar"></div></div><p id="stepName" class="pill"></p></div>
<section id="screen"></section>
<div class="actions no-print"><button id="back" class="secondary" onclick="move(-1)">Back</button><button id="next" onclick="move(1)">Next</button><button class="secondary" onclick="save()">Save</button><button class="secondary" onclick="exportJSON()">Backup JSON</button><label style="margin:0"><input type="file" accept="application/json" onchange="importJSON(event)" style="max-width:190px;font-size:.8rem"></label></div>
</main><script>
const steps=['Customer intake','Project & route','Measure surfaces','Preparation & repairs','Photos & notes','Review & estimate'];
let step=0;
const empty=()=>({customer:'',phone:'',email:'',address:'',gateCode:'',doorCode:'',project:'Interior',route:'Top floor to basement, front to back',rooms:[],repairs:[],notes:'',photos:[],laborRate:90,wallRate:100,trimPrice:3,trimReferenceWidth:4,paintCost:55,paintCoverage:300,paintProduct:'',sundries:[],markup:1.4,finalPrice:''});
let d;try{d=JSON.parse(localStorage.getItem('lp-v1'))||empty()}catch{d=empty()}
if(!Array.isArray(d.sundries))d.sundries=[];
if(!localStorage.getItem('lp-coverage-default-v1')){if(+d.paintCoverage===350)d.paintCoverage=300;localStorage.setItem('lp-coverage-default-v1','1');}
const sundryOptions=['Painter tape (roll)','Masking paper (roll)','Plastic sheeting (roll)','Roller cover (each)','Roller frame (each)','Paint brush (each)','Tray liner (each)','Caulk (tube)','Sandpaper (pack)','Drop cloth (each)','Other'];
function addSundry(){d.sundries.push({name:'Painter tape (roll)',qty:1,unitCost:''});save();render()}
function updateSundry(i,k,v){d.sundries[i][k]=v;save()}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(key,label,type='text'){return `<label for="${key}">${label}</label><input id="${key}" type="${type}" value="${esc(d[key])}" oninput="d['${key}']=this.value;save()">`}
function render(){
$('stepName').textContent=`Step ${step+1} of ${steps.length}: ${steps[step]}`;$('bar').style.width=((step+1)/steps.length*100)+'%';$('back').disabled=step===0;$('next').textContent=step===steps.length-1?'Start new inspection':'Next';let h='';
if(step===0)h=`<div class="card"><h2>Customer intake</h2>${field('customer','Customer name')}${field('phone','Phone','tel')}${field('email','Email','email')}${field('address','Property address')}${field('gateCode','Gate code (optional)')}${field('doorCode','Door code (optional)')}<p><small>Complete the customer details before inspecting.</small></p></div>`;
if(step===1)h=`<div class="card"><h2>Inspection plan</h2><label>Project type</label><select onchange="d.project=this.value;d.route=this.value==='Exterior'?'Clockwise from front elevation':'Top floor to basement, front to back';save();render()">${['Interior','Exterior','Deck','Other'].map(x=>`<option ${d.project===x?'selected':''}>${x}</option>`).join('')}</select>${field('route','Inspection route / starting point')}<p>Follow a consistent route. Add each room, wall, elevation, or deck section as you reach it.</p></div>`;
if(step===2)h=`<div class="card"><h2>Surface measurements</h2><p>Enter individual walls or entire rectangular rooms. All dimensions in feet; decimals allowed (e.g., 8.5). Two coats default.</p><div class="actions"><button onclick="addSurface('Wall')">+ Individual wall</button><button onclick="addSurface('Room')">+ Entire room</button></div></div>`+d.rooms.map((r,i)=>`<div class="card"><h3>${esc(r.kind)} ${i+1}</h3><label>Location / room</label><input value="${esc(r.name)}" oninput="updateSurface(${i},'name',this.value)"><div class="row"><div><label>${r.kind==='Room'?'Room length':'Wall length'} (ft)</label><input type="number" min="0" step="any" value="${esc(r.length)}" oninput="updateSurface(${i},'length',this.value)"></div><div><label>${r.kind==='Room'?'Room width':'Wall height'} (ft)</label><input type="number" min="0" step="any" value="${esc(r.width)}" oninput="updateSurface(${i},'width',this.value)"></div></div>${r.kind==='Room'?`<label>Wall height (ft)</label><input type="number" min="0" step="any" value="${esc(r.height)}" oninput="updateSurface(${i},'height',this.value)">`:''}<div class="row"><div><label>Excluded openings (sq ft)</label><input type="number" min="0" step="any" value="${esc(r.deduct)}" oninput="updateSurface(${i},'deduct',this.value)"></div><div><label>Finish coats</label><select onchange="updateSurface(${i},'coats',this.value)">${[1,2,3].map(n=>`<option ${+r.coats===n?'selected':''}>${n}</option>`).join('')}</select></div></div><label>Trim to paint (linear ft)</label><input type="number" min="0" step="any" value="${esc(r.trim)}" oninput="updateSurface(${i},'trim',this.value)"><label>Trim width (inches)</label><input type="number" min="0" step="any" placeholder="Example: 5" value="${esc(r.trimWidth??'')}" oninput="updateSurface(${i},'trimWidth',this.value)"><label>Scope / window trim / doors / ceilings / primer notes</label><textarea oninput="updateSurface(${i},'scope',this.value)">${esc(r.scope)}</textarea><p id="area-${i}"><strong>Net wall area: ${area(r).toFixed(1)} sq ft</strong></p><button class="secondary" onclick="d.rooms.splice(${i},1);save();render()">Remove section</button></div>`).join('');
if(step===3)h=`<div class="card"><h2>Additional work and preparation</h2><p>Record separate work so it is not accidentally included twice in painting labor.</p><button onclick="d.repairs.push({name:'Drywall repair',qty:1,hours:1,include:true});save();render()">+ Add task</button></div>`+d.repairs.map((r,i)=>`<div class="card"><label>Task</label><select onchange="updateRepair(${i},'name',this.value)">${['Drywall repair','Nail holes / nail pops','Caulking','Sanding / scraping','Spot priming','Furniture moving','Artwork removal / replacement','Door removal / reinstall','Floor protection','Scaffolding / access','Other'].map(x=>`<option ${r.name===x?'selected':''}>${x}</option>`).join('')}</select><div class="row"><div><label>Quantity</label><input type="number" min="0" step="any" value="${esc(r.qty)}" oninput="updateRepair(${i},'qty',this.value)"></div><div><label>Additional labor hours (total)</label><input type="number" min="0" step="any" value="${esc(r.hours)}" oninput="updateRepair(${i},'hours',this.value)"></div></div><label class="check"><input type="checkbox" ${r.include?'checked':''} onchange="updateRepair(${i},'include',this.checked)">Charge separately (uncheck if already included in base scope)</label><button class="secondary" onclick="d.repairs.splice(${i},1);save();render()">Remove</button></div>`).join('');
if(step===4)h=`<div class="card"><h2>Photos & field notes</h2><label>Inspection notes</label><textarea oninput="d.notes=this.value;save()">${esc(d.notes)}</textarea><label>Attach photos (stored locally; keep backups)</label><input type="file" accept="image/*" multiple onchange="addPhotos(event)"><p><small>Large photos can exceed browser storage limits. Use the phone's normal photo library as an additional backup.</small></p></div>`+d.photos.map((p,i)=>`<div class="card"><img src="${p.data}" alt="Inspection photo" style="max-width:100%;max-height:220px"><label>Location / caption</label><input value="${esc(p.caption)}" oninput="d.photos[${i}].caption=this.value;save()"><button class="secondary" onclick="d.photos.splice(${i},1);save();render()">Remove photo</button></div>`).join('');
if(step===5){let c=calc();h=`<div class="card"><h2>Internal preliminary estimate</h2><p><strong>${esc(d.customer||'Unnamed customer')}</strong><br>${esc(d.address)}<br>${esc(d.project)}</p><p>Wall surface: ${c.area.toFixed(1)} sq ft<br>Coat-adjusted wall area: ${c.coatArea.toFixed(1)} sq ft<br>Trim: ${c.trim.toFixed(1)} linear ft; preliminary trim charge: ${money(c.trimTotal)}<br>Estimated labor: ${c.hours.toFixed(1)} hours<br>Paint: ${c.gallons.toFixed(1)} gallons (planning estimate)<br>Wall and prep labor: ${money(c.laborTotal)}<br>Paint purchase cost: ${money(c.paintCostTotal)}<br>Sundry materials purchase cost: ${money(c.sundryCostTotal)}<br>Materials after multiplier: ${money(c.materialsTotal)}<br>Suggested preliminary price: <strong>${money(c.price)}</strong></p><p class="notice">This preliminary calculation is not a verified customer quote. Trim pricing adjusts proportionally to entered width and coat count using an editable reference width. This is a planning assumption, not a verified trim production rate; trim profiles, edges, prep and access require review. Assumptions are editable. Estimate excludes unmeasured ceilings, doors, taxes, travel, and other unpriced scope. Amy must review before quoting.</p><label>Amy's approved selling price (optional)</label><input type="number" min="0" step="any" value="${esc(d.finalPrice)}" oninput="d.finalPrice=this.value;save()"><h3>Paint and materials</h3><label>Paint brand / product (optional)</label><input type="text" value="${esc(d.paintProduct||'')}" placeholder="Example: Sherwin-Williams Duration" oninput="d.paintProduct=this.value;save()"><h3>Editable estimating assumptions</h3><div class="row">${[['laborRate','Labor $/hour'],['wallRate','Wall sq ft/hour (2 coats)'],['trimPrice','Trim $/linear ft (2 coats at reference width)'],['trimReferenceWidth','Reference trim width (inches)'],['paintCost','Paint $/gallon'],['paintCoverage','Coverage sq ft/gallon/coat'],['markup','Material cost multiplier']].map(([k,l])=>`<div><label>${l}</label><input type="number" min="0.01" step="any" value="${esc(d[k])}" oninput="d.${k}=+this.value;save()"></div>`).join('')}</div><p><small>Multiplier 1.4 adds 40% to paint and sundry purchase costs (40% markup, not 40% margin). Enter actual prices; blank sundry prices count as $0.</small></p><h3>Other sundry materials</h3><button class="secondary" onclick="addSundry()">+ Add sundry item</button>${d.sundries.map((item,i)=>`<div class="card"><label>Material</label><select onchange="updateSundry(${i},'name',this.value)">${[...new Set([...sundryOptions,item.name])].map(name=>`<option ${item.name===name?'selected':''}>${esc(name)}</option>`).join('')}</select><div class="row"><div><label>Quantity</label><input type="number" min="0" step="any" value="${esc(item.qty)}" oninput="updateSundry(${i},'qty',this.value)"></div><div><label>Cost per item ($)</label><input type="number" min="0" step="any" placeholder="Enter cost" value="${esc(item.unitCost)}" oninput="updateSundry(${i},'unitCost',this.value)"></div></div><button class="secondary" onclick="d.sundries.splice(${i},1);save();render()">Remove item</button></div>`).join('')}<div class="actions"><button onclick="render()">Recalculate</button><button onclick="window.print()">Print / Save PDF</button><button class="secondary" onclick="downloadCustomerReport()">Customer scope (no internal pricing)</button><button onclick="shareReport()">Share report</button><button class="secondary" onclick="downloadReport()">Download text report</button></div></div><div class="card" id="report"><h2>Inspection report</h2><pre>${esc(report())}</pre>${d.photos.map(p=>`<figure><img src="${p.data}" style="max-width:100%;max-height:400px"><figcaption>${esc(p.caption)}</figcaption></figure>`).join('')}</div>`}
$('screen').innerHTML=h;
}
function area(r){let a=r.kind==='Room'?2*(+r.length + +r.width)*(+r.height):(+r.length)*(+r.width);return Math.max(0,a-(+r.deduct||0))}
function calc(){
let a=0,coat=0,trim=0,trimTotal=0;
const baseWidth=Math.max(.01,+d.trimReferenceWidth||4),baseRate=Math.max(0,+d.trimPrice||0);
d.rooms.forEach(r=>{let x=area(r);a+=x;coat+=x*(+r.coats||2)/2;let ft=Math.max(0,+r.trim||0);trim+=ft;let width=(r.trimWidth!==undefined&&r.trimWidth!==''&&+r.trimWidth>0)?+r.trimWidth:baseWidth;trimTotal+=ft*baseRate*(width/baseWidth)*((+r.coats||2)/2)});
let prep=d.repairs.reduce((sum,r)=>sum+(r.include?(+r.hours||0):0),0);
let hours=coat/(+d.wallRate||100)+prep;
let gallons=d.rooms.reduce((sum,r)=>sum+area(r)*(+r.coats||2)/Math.max(1,+d.paintCoverage||300),0)*1.1;
let laborTotal=hours*(+d.laborRate||90);
let paintCostTotal=gallons*Math.max(0,+d.paintCost||0);
let sundryCostTotal=d.sundries.reduce((sum,item)=>sum+Math.max(0,+item.qty||0)*Math.max(0,+item.unitCost||0),0);
let materialsTotal=(paintCostTotal+sundryCostTotal)*Math.max(0,+d.markup||0);
let price=laborTotal+trimTotal+materialsTotal;
return {area:a,coatArea:coat,trim,trimTotal,hours,gallons,laborTotal,paintCostTotal,sundryCostTotal,materialsTotal,price}
}
function money(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function report(){let c=calc();return `LAKE PAINTERS — INTERNAL FIELD INSPECTION\nCustomer: ${d.customer}\nPhone: ${d.phone}\nEmail: ${d.email}\nAddress: ${d.address}\nGate code: ${d.gateCode||''}\nDoor code: ${d.doorCode||''}\nProject: ${d.project}\nRoute: ${d.route}\n\nSURFACES\n${d.rooms.map((r,i)=>`${i+1}. ${r.name||r.kind}: ${area(r).toFixed(1)} sq ft, ${r.coats} coats, ${r.trim||0} LF trim${r.trimWidth?`, ${r.trimWidth} in wide`:''}. ${r.scope||''}`).join('\n')}\n\nADDITIONAL TASKS\n${d.repairs.map(r=>`${r.name}: qty ${r.qty}, ${r.hours} additional hours, ${r.include?'separate':'included'}`).join('\n')}\n\nFIELD NOTES\n${d.notes}\n\nPRELIMINARY INTERNAL PRICING\nWall area ${c.area.toFixed(1)} sq ft; estimated labor ${c.hours.toFixed(1)} hours; paint ${c.gallons.toFixed(1)} gallons; trim ${c.trim.toFixed(1)} LF; trim charge ${money(c.trimTotal)} (reference ${d.trimReferenceWidth||4} inches at ${money(+d.trimPrice||0)}/LF for two coats; width and coats adjusted).\nPaint product: ${d.paintProduct||'Not specified'}\nWall and preparation labor: ${money(c.laborTotal)}\nTrim charge: ${money(c.trimTotal)}\nPaint purchase cost: ${money(c.paintCostTotal)}\nSundry materials:\n${d.sundries.map(item=>`- ${item.name}: ${item.qty||0} at ${money(Math.max(0,+item.unitCost||0))} each = ${money(Math.max(0,+item.qty||0)*Math.max(0,+item.unitCost||0))}`).join('\n')}\nSundry materials purchase total: ${money(c.sundryCostTotal)}\nMaterial multiplier: ${d.markup} (markup on paint and sundries)\nMaterials after multiplier: ${money(c.materialsTotal)}\nSuggested price: ${money(c.price)}\nAmy's final price: ${d.finalPrice?money(+d.finalPrice):'Pending review'}\n\nPhotos: ${d.photos.length} attached in app. Verify all scope and pricing before sending to customer.`}
function updateSurface(i,k,v){d.rooms[i][k]=v;save();let e=$('area-'+i);if(e)e.innerHTML='<strong>Net wall area: '+area(d.rooms[i]).toFixed(1)+' sq ft</strong>'}
function updateRepair(i,k,v){d.repairs[i][k]=v;save()}
function addSurface(kind){d.rooms.push({kind,name:'',length:'',width:'',height:'',deduct:0,coats:2,trim:0,trimWidth:'',scope:''});save();render()}
function move(n){if(step===5&&n===1){if(!confirm('Start a new inspection? Export a backup first. This will replace the locally saved inspection.'))return;d=empty();step=0;save();render();return}step=Math.max(0,Math.min(5,step+n));save();render();window.scrollTo(0,0)}
function save(){try{localStorage.setItem('lp-v1',JSON.stringify(d));localStorage.setItem('lp-step',step)}catch(e){alert('Browser storage is full. Export your inspection backup and reduce photos.')} }
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportJSON(){download('lake-painters-inspection-backup.json',JSON.stringify(d,null,2),'application/json')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.rooms)||!Array.isArray(obj.repairs))throw Error('Invalid format');d={...empty(),...obj};step=0;save();render()}catch{alert('Could not read inspection backup')}};reader.readAsText(f)}
function customerReport(){return `LAKE PAINTERS — DRAFT PROJECT SCOPE\nCustomer: ${d.customer}\nProperty: ${d.address}\nProject: ${d.project}\n\nPROPOSED WORK (SUBJECT TO REVIEW)\n${d.rooms.map((r,i)=>`${i+1}. ${r.name||r.kind}: ${area(r).toFixed(1)} sq ft, ${r.coats} coats. ${r.scope||''}`).join('\n')}\n\nADDITIONAL WORK TO REVIEW\n${d.repairs.map(r=>`${r.name}: ${r.qty}`).join('\n')}\n\nFinal scope and pricing require Lake Painters approval.`}
function downloadCustomerReport(){download('lake-painters-customer-scope-DRAFT.txt',customerReport(),'text/plain')}
function downloadReport(){download('lake-painters-INTERNAL-inspection.txt',report(),'text/plain')}
async function shareReport(){let blob=new Blob([report()],{type:'text/plain'});let file=new File([blob],'lake-painters-inspection.txt',{type:'text/plain'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Lake Painters inspection'});else if(navigator.share)await navigator.share({title:'Lake Painters inspection',text:report()});else downloadReport()}catch(e){if(e.name!=='AbortError')downloadReport()}}
function addPhotos(e){[...e.target.files].forEach(f=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));cv.width=im.width*scale;cv.height=im.height*scale;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);d.photos.push({caption:f.name,data:cv.toDataURL('image/jpeg',.65)});save();render()};im.src=reader.result};reader.readAsDataURL(f)})}
try{step=Math.min(5,Math.max(0,+localStorage.getItem('lp-step')||0))}catch{}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
