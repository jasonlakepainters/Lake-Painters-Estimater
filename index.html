<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#083b59"><link rel="manifest" href="manifest.webmanifest"><title>Lake Painters Field Estimator</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#173247;background:#f4f7f8}*{box-sizing:border-box}body{margin:0}header{background:#083b59;color:white;padding:12px 18px;display:flex;align-items:center;gap:12px}header img{width:56px;height:56px;object-fit:cover;border-radius:12px}main{max-width:750px;margin:auto;padding:20px}h1{font-size:1.35rem;margin:0}h2{font-size:1.25rem}small{color:#5c6d78}header small{color:#d8e9f1}.card{background:white;border:1px solid #dce5e8;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 5px #00000008}label{display:block;font-weight:600;margin:13px 0 5px}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #b8c7ce;border-radius:8px;background:white}textarea{min-height:76px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}button{font:inherit;padding:11px 15px;border:0;border-radius:9px;background:#0c577b;color:white;cursor:pointer}button.secondary{background:#e5edf1;color:#12364b}button:disabled{opacity:.45}.pill{background:#e9f4f9;border-radius:30px;padding:7px 12px;display:inline-block;font-size:.85rem}.hide{display:none}.notice{padding:10px;border-left:4px solid #d49a2a;background:#fff7e5}.check{display:flex;align-items:center;gap:9px;margin:10px 0}.check input{width:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:.9rem}.progress{height:7px;background:#dce5e8;border-radius:9px;overflow:hidden}.progress>div{height:100%;background:#1c8eab;transition:width .2s}@media print{header,.actions,.no-print,.progress{display:none!important}main{max-width:none}.card{box-shadow:none;break-inside:avoid}body{background:white}}
</style></head><body><header><img src="logo.jpg" alt="Lake Painters official logo"><div><h1>Lake Painters</h1><small>Field Estimator · Prototype v1</small></div></header><main>
<div class="notice no-print">Prototype: saves data in this browser only. Export a backup before clearing browser data. No AI, accounts, or Jobber connection yet. Preliminary pricing is internal only.</div>
<div class="card no-print"><div class="progress"><div id="bar"></div></div><p id="stepName" class="pill"></p></div>
<div class="actions no-print" aria-label="Top page navigation"><button id="backTop" class="secondary" onclick="move(-1)">Back</button><button id="nextTop" onclick="move(1)">Next</button></div>
<section id="screen"></section>
<div class="actions no-print"><button id="back" class="secondary" onclick="move(-1)">Back</button><button id="next" onclick="move(1)">Next</button><button class="secondary" onclick="save()">Save</button><button class="secondary" onclick="exportJSON()">Backup JSON</button><label style="margin:0"><input type="file" accept="application/json" onchange="importJSON(event)" style="max-width:190px;font-size:.8rem"></label></div>
</main><script>
const steps=['Customer intake','Project & route','Measure surfaces','Paint specifications','Preparation & repairs','Photos & notes','Review & estimate'];
let step=0;
const empty=()=>({customer:'',phone:'',email:'',address:'',gateCode:'',doorCode:'',project:'Interior',route:'Top floor to basement, front to back',rooms:[],repairs:[],notes:'',photos:[],laborRate:90,wallRate:100,soffitRate:30,fasciaRate:0,fasciaSqftRate:25,gutterRate:30,gutterSqftRate:18,shutterRate:20,columnRate:20,porchRate:30,railingRate:20,garageDoorRate:50,roofEdgeDifficulty:1.25,trimPrice:3,doorSidePrice:75,doorFaceArea:21,trimReferenceWidth:4,paintCost:55,primerSqFt:0,primerCoats:1,primerCoverage:300,primerCost:55,primerProduct:'',primerSize:'1 gallon',paintCoverage:300,sprayCoverage:225,applicationMethod:'Brush and roll',sprayPercent:50,paintBrand:'Sherwin-Williams',paintUse:'Interior',paintProduct:'',paintSheen:'',paintSku:'',paintSize:'1 gallon',sundries:[],equipment:[],markup:1.4,finalPrice:''});
let d;try{d=JSON.parse(localStorage.getItem('lp-v1'))||empty()}catch{d=empty()}
if(!Array.isArray(d.sundries))d.sundries=[];
if(!Array.isArray(d.equipment))d.equipment=[];
if(d.roofEdgeDifficulty===undefined)d.roofEdgeDifficulty=1.25;
// One-time migration of the old unpriced zeros to conservative two-coat starting assumptions.
try{if(!localStorage.getItem('lp-exterior-rates-v1')){const defaults={soffitRate:30,fasciaSqftRate:25,gutterRate:30,gutterSqftRate:18,shutterRate:20,columnRate:20,porchRate:30,railingRate:20,garageDoorRate:50};for(const [k,v] of Object.entries(defaults)){if(!(Number(d[k])>0))d[k]=v}localStorage.setItem('lp-exterior-rates-v1','1');localStorage.setItem('lp-v1',JSON.stringify(d));}}catch(e){}
if(!localStorage.getItem('lp-coverage-default-v1')){if(+d.paintCoverage===350)d.paintCoverage=300;localStorage.setItem('lp-coverage-default-v1','1');}
const paintBrands=['Sherwin-Williams','Dutch Boy','Benjamin Moore','Valspar','Pittsburgh Paints & Stains','Behr','Glidden','PPG','Clark+Kensington','Rust-Oleum','Other'];
if(!d.paintBrand)d.paintBrand='Sherwin-Williams';
if(!d.paintUse)d.paintUse='Interior';
if(!d.paintSheen)d.paintSheen='';
if(!d.paintSku)d.paintSku='';
if(!d.paintSize)d.paintSize='1 gallon';
if(!d.applicationMethod)d.applicationMethod='Brush and roll';
if(!(Number(d.sprayCoverage)>0))d.sprayCoverage=225;
if(d.sprayPercent===undefined)d.sprayPercent=50;
function changePaintBrand(brand){
 d.paintBrand=brand;
 d.paintProduct='';d.paintSheen='';d.paintSku='';
 if(brand==='Sherwin-Williams')d.paintCost=55;
 else if(brand==='Dutch Boy')d.paintCost=35;
 else if(brand==='Benjamin Moore')d.paintCost=65;
 save();render();
}
const paintCatalog={
'Sherwin-Williams':{Interior:['Duration Home','Emerald Interior','SuperPaint Interior','Cashmere','ProMar 200','ProMar 400','Emerald Urethane Trim Enamel','ProClassic','Other / custom'],Exterior:['Duration Exterior','Emerald Exterior','SuperPaint Exterior','A-100','Latitude','WoodScapes','Other / custom']},
'Dutch Boy':{Interior:['Dura Clean Interior','Dura Fighter Interior','Platinum Interior','Other / custom'],Exterior:['Dura Clean Exterior','Dura Weather Exterior','Other / custom']},
'Benjamin Moore':{Interior:['Aura Interior','Regal Select Interior','ben Interior','Ultra Spec 500','ADVANCE','Other / custom'],Exterior:['Aura Exterior','Regal Select Exterior','ben Exterior','Ultra Spec Exterior','Other / custom']},
'Valspar':{Interior:['Signature Interior','Reserve Interior','Ultra Interior','Other / custom'],Exterior:['Duramax Exterior','Defense Exterior','Other / custom']},
'Behr':{Interior:['Marquee Interior','Dynasty Interior','Premium Plus Interior','Ultra Interior','Other / custom'],Exterior:['Marquee Exterior','Premium Plus Exterior','Ultra Exterior','Other / custom']}
};

// Deck selections are product-line suggestions, not verified SKU/finish availability.
const deckPaintCatalog={
'Sherwin-Williams':['SuperDeck Exterior Deck & Dock Coating','SuperDeck Waterborne Solid Color Stain','SuperDeck Semi-Transparent Stain','SuperDeck Transparent Stain','WoodScapes Solid Color Stain','Other / custom'],
'Dutch Boy':['Exterior Porch & Floor','Dura Weather Exterior','Other / custom'],
'Benjamin Moore':['ARBORCOAT Exterior Stain','INSL-X Sure Step','Other / custom'],
'Valspar':['One-Coat Solid Color Exterior Stain & Sealer','Deck & Porch Paint','Other / custom'],
'Behr':['Premium Solid Color Waterproofing Stain & Sealer','Premium Semi-Transparent Waterproofing Stain & Sealer','Premium Porch & Patio Floor Paint','Other / custom'],
'PPG':['ProLuxe Exterior Wood Stain','Other / custom'],
'Rust-Oleum':['RockSolid Deck Resurfacer','Other / custom']
};
const paintSheens=['Flat','Matte','Eggshell','Satin','Low Lustre','Pearl','Semi-Gloss','Gloss','High Gloss','Other / custom'];
function selectedPaintProducts(){return d.paintUse==='Deck'?(deckPaintCatalog[d.paintBrand]||['Other / custom']):(paintCatalog[d.paintBrand]?.[d.paintUse]||['Other / custom'])}
function changePaintUse(v){d.paintUse=v;d.paintProduct='';d.paintSheen='';d.paintSku='';save();render()}
function changePaintProduct(v){d.paintProduct=v==='Other / custom'?'':v;d.paintSku='';save();render()}
function changePaintSheen(v){d.paintSheen=v==='Other / custom'?'':v;save();render()}
const sundryOptions=['Painter tape (roll)','Masking paper (roll)','Masking film (roll)','Plastic sheeting (roll)','Painter plastic (roll)','Masking tape (roll)','Caulk (tube)','Exterior sealant (tube)','Primer (gallon; use only when not in primer takeoff)','Drop cloth (each)','Painter paper (roll)','Roller cover (each)','Roller frame (each)','Paint brush (each)','Tray liner (each)','Sandpaper (pack)','Scraper blade (each)','Respirator filter (pair)','Miscellaneous / other'];
const equipmentOptions=['Step ladder','Extension ladder','Multi-position ladder','Scaffolding rental','Scaffolding setup / breakdown','Aerial lift rental','Boom lift rental','Ladder stabilizer','Pressure washer rental','Sprayer rental','Other equipment'];
function addEquipment(){d.equipment.push({name:'Extension ladder',qty:1,unitCost:'',setupHours:0});save();render()}
function updateEquipment(i,k,v){d.equipment[i][k]=v;save()}
function addSundry(){d.sundries.push({name:'Painter tape (roll)',qty:1,unitCost:''});save();render()}
function updateSundry(i,k,v){d.sundries[i][k]=v;save()}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(key,label,type='text'){return `<label for="${key}">${label}</label><input id="${key}" type="${type}" value="${esc(d[key])}" oninput="d['${key}']=this.value;save()">`}
const paintGroupLabels={walls:'Walls / siding / gables / dormers',soffits:'Soffits / porch ceilings',trim:'Trim / fascia / gutters / shutters / columns',doors:'Doors / garage doors when measured as door sides'};
function setPaintAssignment(group,key,value){
 if(!d.paintAssignments)d.paintAssignments={};
 if(!d.paintAssignments[group])d.paintAssignments[group]={};
 d.paintAssignments[group][key]=value;
 if(key==='brand')d.paintAssignments[group].product='';
 save();if(key==='brand')render();
}
function paintGroupEditor(group){
 const p=(d.paintAssignments||{})[group]||{},brand=p.brand||d.paintBrand||'Sherwin-Williams',use=d.paintUse||'Exterior';
 const options=(use==='Deck'?(deckPaintCatalog[brand]||[]):(paintCatalog[brand]?.[use]||[]));
 return `<details class="card"><summary><strong>${paintGroupLabels[group]}</strong> — ${esc(p.product||d.paintProduct||'main paint')}</summary><p><small>Leave blank to use the main paint. Choose a separate product when the coating differs. Exact SKUs and coverage must be verified for the selected finish.</small></p><label>Brand</label><select onchange="setPaintAssignment('${group}','brand',this.value)"><option value="">Use main brand</option>${paintBrands.map(b=>`<option value="${esc(b)}" ${p.brand===b?'selected':''}>${esc(b)}</option>`).join('')}</select><label>Product line</label><select onchange="setPaintAssignment('${group}','product',this.value)"><option value="">Use main product</option>${options.map(v=>`<option value="${esc(v)}" ${p.product===v?'selected':''}>${esc(v)}</option>`).join('')}</select><label>Custom product / line</label><input type="text" value="${esc(p.product||'')}" placeholder="Product name" oninput="setPaintAssignment('${group}','product',this.value)"><label>Sheen</label><select onchange="setPaintAssignment('${group}','sheen',this.value)"><option value="">Use main sheen</option>${paintSheens.map(v=>`<option ${p.sheen===v?'selected':''}>${esc(v)}</option>`).join('')}</select><label>Container size</label><select onchange="setPaintAssignment('${group}','containerSize',this.value)"><option value="">Use main size</option>${['Quart','1 gallon','5 gallons'].map(v=>`<option ${p.containerSize===v?'selected':''}>${v}</option>`).join('')}</select><label>Verified SKU</label><input value="${esc(p.sku||'')}" oninput="setPaintAssignment('${group}','sku',this.value)"><div class="row"><div><label>Actual $/gallon (blank = main)</label><input type="number" min="0" step="any" value="${esc(p.cost??'')}" oninput="setPaintAssignment('${group}','cost',this.value)"></div><div><label>Brush/roll coverage sq ft/gal/coat (blank = main)</label><input type="number" min="1" step="any" value="${esc(p.coverage??'')}" oninput="setPaintAssignment('${group}','coverage',this.value)"></div></div><label>Spray coverage sq ft/gal/coat (blank = main)</label><input type="number" min="1" step="any" value="${esc(p.sprayCoverage??'')}" oninput="setPaintAssignment('${group}','sprayCoverage',this.value)"></details>`;
}
function renderPaintTakeoff(c){
 const label={walls:'Walls and siding',soffits:'Soffits and porch ceilings',trim:'Trim, fascia, gutters, shutters, columns',doors:'Doors'};
 const categories=c.paintTakeoff.filter(p=>p.coatSqFt>0).map(p=>`<details class="card"><summary><strong>${label[p.key]||p.key}: ${p.gallons.toFixed(2)} gallons</strong></summary><p>Coat-adjusted area: ${p.coatSqFt.toFixed(1)} sq ft<br>Product: ${esc(p.brand)} ${esc(p.product)} ${esc(p.sheen||'')}<br>Estimate includes 10% waste and selected application coverage.</p></details>`).join('');
 const purchases=c.purchasePlan.map(p=>`<p><strong>${esc(p.brand)} ${esc(p.product)}</strong> — ${p.gallons.toFixed(2)} gallons needed; buy ${p.containers} × ${esc(p.containerSize)} (${p.purchaseGallons.toFixed(2)} gallons). Cost: ${money(p.totalCost)}</p>`).join('');
 const warning=c.unpriced.length?`<p class="notice"><strong>Not ready for approval:</strong> ${esc(c.unpriced.join('; '))}</p>`:'<p class="notice">Preliminary estimate. Verify production, coating compatibility and unmeasured work before approval.</p>';
 return `<div class="card"><h3>Paint needed by project category</h3><p>Select a category below to view its gallons. If categories share the same coating, purchase quantities are combined.</p>${categories||'<p>Enter measurements first.</p>'}<h3>Paint purchase totals by product</h3>${purchases||'<p>No finish paint required from entered surfaces.</p>'}<p><strong>Total estimated finish paint: ${c.gallons.toFixed(2)} gal. Total purchase quantity: ${c.purchaseGallons.toFixed(2)} gal.</strong></p><p><strong>Primer:</strong> ${c.primerGallons.toFixed(2)} gallons estimated; buy ${c.primerContainers} × ${esc(d.primerSize||'1 gallon')} (${c.primerPurchaseGallons.toFixed(2)} gallons), purchase cost ${money(c.primerCostTotal)}.</p>${warning}</div>`;
}
function render(){
$('stepName').textContent=`Step ${step+1} of ${steps.length}: ${steps[step]}`;$('bar').style.width=((step+1)/steps.length*100)+'%';$('back').disabled=$('backTop').disabled=step===0;$('next').textContent=$('nextTop').textContent=step===steps.length-1?'Start new inspection':'Next';let h='';
if(step===0)h=`<div class="card"><h2>Customer intake</h2>${field('customer','Customer name')}${field('phone','Phone','tel')}${field('email','Email','email')}${field('address','Property address')}${field('gateCode','Gate code (optional)')}${field('doorCode','Door code (optional)')}<p><small>Complete the customer details before inspecting.</small></p></div>`;
if(step===1)h=`<div class="card"><h2>Inspection plan</h2><label>Project type</label><select onchange="changeProject(this.value)">${['Interior','Exterior','Deck','Other'].map(x=>`<option ${d.project===x?'selected':''}>${x}</option>`).join('')}</select>${field('route','Inspection route / starting point')}<p>Follow a consistent route. Add each room, wall, elevation, or deck section as you reach it.</p></div>`;
if(step===2&&d.project==='Exterior')h=exteriorScreen();
if(step===2&&d.project==='Deck')h=deckScreen();
if(step===2&&d.project!=='Exterior'&&d.project!=='Deck')h=`<div class="card"><h2>Surface measurements</h2><p>Enter individual walls or entire rectangular rooms. All dimensions in feet; decimals allowed (e.g., 8.5). Two coats default.</p><div class="actions"><button onclick="addSurface('Wall')">+ Individual wall</button><button onclick="addSurface('Room')">+ Entire room</button></div></div>`+d.rooms.map((r,i)=>`<div class="card"><h3>${esc(r.kind)} ${i+1}</h3><label>Location / room</label><input value="${esc(r.name)}" oninput="updateSurface(${i},'name',this.value)"><div class="row"><div><label>${r.kind==='Room'?'Room length':'Wall length'} (ft)</label><input type="number" min="0" step="any" value="${esc(r.length)}" oninput="updateSurface(${i},'length',this.value)"></div><div><label>${r.kind==='Room'?'Room width':'Wall height'} (ft)</label><input type="number" min="0" step="any" value="${esc(r.width)}" oninput="updateSurface(${i},'width',this.value)"></div></div>${r.kind==='Room'?`<label>Wall height (ft)</label><input type="number" min="0" step="any" value="${esc(r.height)}" oninput="updateSurface(${i},'height',this.value)">`:''}<div class="row"><div><label>Excluded openings (sq ft)</label><input type="number" min="0" step="any" value="${esc(r.deduct)}" oninput="updateSurface(${i},'deduct',this.value)"></div><div><label>Finish coats</label><select onchange="updateSurface(${i},'coats',this.value)">${[1,2,3].map(n=>`<option ${+r.coats===n?'selected':''}>${n}</option>`).join('')}</select></div></div>${difficultySelect(i,'wallDifficulty','Wall / room difficulty (labor multiplier)')}<label>Trim to paint (linear ft)</label><input type="number" min="0" step="any" value="${esc(r.trim)}" oninput="updateSurface(${i},'trim',this.value)"><label>Trim width (inches)</label><input type="number" min="0" step="any" placeholder="Example: 5" value="${esc(r.trimWidth??'')}" oninput="updateSurface(${i},'trimWidth',this.value)"><label>Door sides to paint (count each painted face)</label><input type="number" min="0" step="1" value="${esc(r.doorSides??0)}" oninput="updateSurface(${i},'doorSides',this.value)"><p><small>One face = one side; painting both faces of one door = 2 sides. Door casing remains in trim linear feet.</small></p><label>Scope / window trim / ceilings / primer notes</label><textarea oninput="updateSurface(${i},'scope',this.value)">${esc(r.scope)}</textarea><p id="area-${i}"><strong>Net wall area: ${area(r).toFixed(1)} sq ft</strong></p><button class="secondary" onclick="d.rooms.splice(${i},1);save();render()">Remove section</button></div>`).join('');
if(step===3)h=`<div class="card"><h2>Paint specifications</h2><p>Select the paint being considered for this project. Confirm the exact product, finish, and compatibility before ordering.</p><h3>Paint and materials</h3><label>Paint brand</label><select onchange="changePaintBrand(this.value)">${paintBrands.map(b=>`<option value="${esc(b)}" ${d.paintBrand===b?'selected':''}>${esc(b)}</option>`).join('')}</select><label>Interior or exterior paint</label><select onchange="changePaintUse(this.value)"><option ${d.paintUse==='Interior'?'selected':''}>Interior</option><option ${d.paintUse==='Exterior'?'selected':''}>Exterior</option><option ${d.paintUse==='Deck'?'selected':''}>Deck</option></select><label>Paint product / line</label><select onchange="changePaintProduct(this.value)"><option value="">Select paint line</option>${selectedPaintProducts().map(p=>`<option ${d.paintProduct===p?'selected':''}>${esc(p)}</option>`).join('')}</select><label>Other / custom product (optional)</label><input type="text" value="${esc(d.paintProduct||'')}" placeholder="Enter or adjust product name" oninput="d.paintProduct=this.value;save()"><label>Paint sheen</label><select onchange="changePaintSheen(this.value)"><option value="">Select sheen</option>${paintSheens.map(p=>`<option ${d.paintSheen===p?'selected':''}>${esc(p)}</option>`).join('')}</select><label>Other / custom sheen (optional)</label><input type="text" value="${esc(d.paintSheen||'')}" placeholder="Enter or adjust sheen" oninput="d.paintSheen=this.value;save()"><h3>Application method and coverage</h3><label>How will this paint be applied?</label><select onchange="d.applicationMethod=this.value;save();render()"><option value="Brush and roll" ${d.applicationMethod==='Brush and roll'?'selected':''}>Brush and roll</option><option value="Spray" ${d.applicationMethod==='Spray'?'selected':''}>Spray</option><option value="Combination" ${d.applicationMethod==='Combination'?'selected':''}>Combination: spray and brush/roll</option></select><div class="row"><div><label>Brush / roll coverage (sq ft/gal/coat)</label><input type="number" min="1" step="any" value="${esc(d.paintCoverage)}" oninput="d.paintCoverage=this.value;save()"></div><div><label>Spray coverage (sq ft/gal/coat)</label><input type="number" min="1" step="any" value="${esc(d.sprayCoverage)}" oninput="d.sprayCoverage=this.value;save()"></div></div>${d.applicationMethod==='Combination'?'<label>Percentage of area sprayed (0–100%)</label><input type="number" min="0" max="100" step="1" value="'+esc(d.sprayPercent)+'" oninput="d.sprayPercent=this.value;save()">':''}<p><small>Lake Painters planning defaults: 300 sq ft/gal/coat by brush/roll and 225 by spray (your observed 200–250 range). Combination calculates each portion separately. The existing 10% planning allowance is applied afterward; verify product-specific coverage and substrate absorption.</small></p><label>Manufacturer / store SKU (enter verified code)</label><input type="text" value="${esc(d.paintSku||'')}" placeholder="Exact SKU from product label or supplier" oninput="d.paintSku=this.value;save()"><label>Container size</label><select onchange="d.paintSize=this.value;save()">${['Quart','1 gallon','5 gallons','Other'].map(v=>`<option ${d.paintSize===v?'selected':''}>${v}</option>`).join('')}</select><p><small>Confirm product, sheen and interior/exterior compatibility with the manufacturer before ordering. Brand and product choices do not change the gallon price automatically. For exterior jobs, use the separate product groups below when the same paint will not be used everywhere.</small></p></div>${d.project==='Exterior'?`<div class="card"><h3>Separate paint products by surface</h3><p>Select a different product only when needed. Each group has its own coverage and cost; the total is calculated by product.</p></div>${Object.keys(paintGroupLabels).map(paintGroupEditor).join('')}`:''}`;
if(step===3)h+=`<div class="card"><h3>Separate primer allowance</h3><p>Enter only the area receiving primer. Finish-paint quantities remain separate.</p><div class="row"><div><label>Primer area (sq ft)</label><input type="number" min="0" step="any" value="${esc(d.primerSqFt??0)}" oninput="d.primerSqFt=this.value;save()"></div><div><label>Primer coats</label><select onchange="d.primerCoats=this.value;save()">${[1,2,3].map(n=>`<option ${+d.primerCoats===n?'selected':''}>${n}</option>`).join('')}</select></div></div><label>Primer product / verified SKU</label><input value="${esc(d.primerProduct||'')}" oninput="d.primerProduct=this.value;save()"><div class="row"><div><label>Primer coverage sq ft/gal/coat</label><input type="number" min="1" step="any" value="${esc(d.primerCoverage??300)}" oninput="d.primerCoverage=this.value;save()"></div><div><label>Primer cost per gallon</label><input type="number" min="0" step="any" value="${esc(d.primerCost??55)}" oninput="d.primerCost=this.value;save()"></div></div><label>Primer container size</label><select onchange="d.primerSize=this.value;save()">${['Quart','1 gallon','5 gallons'].map(v=>`<option ${d.primerSize===v?'selected':''}>${v}</option>`).join('')}</select><p><small>Primer labor is not included automatically. Add separate preparation labor hours on Page 5 when needed.</small></p></div>`;

class="notice">Exterior production rates are conservative provisional two-coat defaults, not verified Lake Painters crew rates. The quote must be approved by Amy after a scope and access review. This preliminary calculation is not a verified customer quote. Trim pricing adjusts proportionally to entered width and coat count using an editable reference width. This is a planning assumption, not a verified trim production rate; trim profiles, edges, prep and access require review. Assumptions are editable. Estimate includes entered door sides at the editable per-side rate, but excludes unmeasured ceilings, unentered doors, taxes, travel, and other unpriced scope. Verify door preparation and paint materials before quoting. Amy must review before quoting.</p><label>Amy's approved selling price (optional)</label><input type="number" min="0" step="any" value="${esc(d.finalPrice)}" oninput="d.finalPrice=this.value;save()"><h3>Editable estimating assumptions</h3><div class="row">${[['laborRate','Labor $/hour'],['wallRate','Wall sq ft/hour (2 coats)'],['soffitRate','Soffits sq ft/hour (2 coats; provisional)'],['fasciaSqftRate','Fascia sq ft/hour (2 coats; provisional)'],['gutterRate','Gutters LF/hour (2 coats; provisional fallback)'],['gutterSqftRate','Gutters sq ft/hour (2 coats; measured exposed face)'],['shutterRate','Shutters painted sq ft/hour (2 coats)'],['columnRate','Columns painted sq ft/hour (2 coats)'],['porchRate','Porch ceiling sq ft/hour (2 coats)'],['railingRate','Railings LF/hour (2 coats; separate baluster evaluation)'],['garageDoorRate','Garage doors sq ft/hour (2 coats)'],['doorFaceArea','Paintable square ft/door side (default 21)'],['roofEdgeDifficulty','Fascia and gutter access factor (1.25 = 25% more hours)'],['trimPrice','Trim $/linear ft (2 coats at reference width)'],['doorSidePrice','Door painting $/side'],['trimReferenceWidth','Reference trim width (inches)'],['paintCost','Paint $/gallon'],['paintCoverage','Brush/roll coverage sq ft/gal/coat'],['sprayCoverage','Spray coverage sq ft/gal/coat'],['markup','Material cost multiplier']].map(([k,l])=>`<div><label>${l}</label><input type="number" min="0.01" step="any" value="${esc(d[k])}" oninput="d.${k}=+this.value;save()"></div>`).join('')}</div><p><small>Per-surface difficulty dropdowns multiply estimated labor hours, not the $90 hourly billing rate. The overall roof-edge factor remains only as the default for sections without an individual selection. A 1.25 factor adds 25% to calculated fascia and gutter hours, not to the hourly rate. Multiplier 1.4 adds 40% to paint and sundry purchase costs (40% markup, not 40% margin). Enter actual prices; blank sundry prices count as $0.</small></p><h3>Jobsite access equipment and rentals</h3><p><small>Record rental or direct equipment charges here, not in sundries. Setup/move hours add to $90/hour labor, but do not also enter those hours in preparation tasks. Company-owned ladders can be recorded with $0 direct rental cost.</small></p><button class="secondary" onclick="addEquipment()">+ Add equipment</button>${(d.equipment||[]).map((item,i)=>`<div class="card"><label>Equipment</label><select onchange="updateEquipment(${i},'name',this.value)">${[...new Set([...equipmentOptions,item.name])].map(v=>`<option ${item.name===v?'selected':''}>${esc(v)}</option>`).join('')}</select><div class="row"><div><label>Quantity / rental days</label><input type="number" min="0" step="any" value="${esc(item.qty??1)}" oninput="updateEquipment(${i},'qty',this.value)"></div><div><label>Direct charge per unit ($)</label><input type="number" min="0" step="any" value="${esc(item.unitCost??'')}" oninput="updateEquipment(${i},'unitCost',this.value)"></div></div><label>Extra setup / move labor hours</label><input type="number" min="0" step="any" value="${esc(item.setupHours??0)}" oninput="updateEquipment(${i},'setupHours',this.value)"><button class="secondary" onclick="d.equipment.splice(${i},1);save();render()">Remove equipment</button></div>`).join('') // Exterior surfaces are measured by elevation instead of by room.
// Standard elevations are added explicitly so no unmeasured areas enter a bid.
function changeProject(v){
 if(v!==d.project&&d.rooms.length){
  if(!confirm('Changing project type will clear the current surface measurements. Export a backup first if you need them. Continue?')){render();return}
  d.rooms=[];
 }
 d.project=v;
 d.route=v==='Exterior'?'Clockwise from front elevation':v==='Deck'?'Deck sections from house outward':'Top floor to basement, front to back';
 if(v==='Exterior')d.paintUse='Exterior';
 if(v==='Deck')d.paintUse='Deck';
 if(v==='Interior')d.paintUse='Interior';
 save();render();
}
function addExteriorTemplate(){
 const names=['Front elevation','Right elevation','Rear elevation','Left elevation'];
 const present=new Set(d.rooms.map(r=>r.name));
 names.filter(n=>!present.has(n)).forEach(name=>d.rooms.push({kind:'Elevation',name,length:'',width:'',height:'',deduct:0,coats:2,trim:0,trimWidth:'',doorSides:0,scope:''}));
 save();render();
}
function addExteriorSurface(kind){
 const names={Elevation:'Additional elevation',Gable:'Gable triangle',Dormer:'Dormer face',GarageDoor:'Garage door',Soffit:'Soffit / porch ceiling',OtherExterior:'Other exterior painted area'};
 d.rooms.push({kind,name:names[kind]||kind,length:'',width:'',height:'',triangleMethod:'baseHeight',triangleLeft:'',triangleRight:'',dormerCount:1,deduct:0,coats:2,trim:0,trimWidth:'',doorSides:0,scope:''});save();render();
}
const difficultyChoices=[1,1.1,1.2,1.25,1.3,1.5,1.75,2];
function difficultySelect(i,key,label,defaultValue=1){
 const value=Number(d.rooms[i][key]??defaultValue);
 return `<label>${label}</label><select onchange="updateSurface(${i},'${key}',this.value)">${difficultyChoices.map(n=>`<option value="${n}" ${Math.abs(value-n)<0.001?'selected':''}>${n.toFixed(2)}×${n===1?' (standard)':''}</option>`).join('')}</select>`;
}
function addDeckSection(){d.rooms.push({kind:'Deck',name:'Deck section',length:'',width:'',deduct:0,coats:2,wallDifficulty:1,deckRailLf:0,deckBalusters:0,deckPosts:0,deckFasciaLf:0,deckTreads:0,deckRisers:0,deckStringers:0,deckHeight:0,scope:''});save();render()}

let h='<div class="card"><h2>Deck measurements</h2><p>Measure decking, rails, posts and stairs separately. All sizes in feet unless noted. Unpriced details will be flagged for Amy.</p><button onclick="addDeckSection()">+ Add deck section</button></div>';
return h+d.rooms.map((r,i)=>`<div class="card"><h3>${esc(r.name||'Deck '+(i+1))}</h3><label>Deck section name</label><input value="${esc(r.name||'')}" oninput="updateSurface(${i},'name',this.value)"><div class="row"><div><label>Deck length (ft)</label><input type="number" min="0" step="any" value="${esc(r.length??'')}" oninput="updateSurface(${i},'length',this.value)"></div><div><label>Deck width (ft)</label><input type="number" min="0" step="any" value="${esc(r.width??'')}" oninput="updateSurface(${i},'width',this.value)"></div></div><div class="row"><div><label>Excluded area (sq ft)</label><input type="number" min="0" step="any" value="${esc(r.deduct??0)}" oninput="updateSurface(${i},'deduct',this.value)"></div><div><label>Finish coats</label><select onchange="updateSurface(${i},'coats',this.value)">${[1,2,3].map(n=>`<option ${+r.coats===n?'selected':''}>${n}</option>`).join('')}</select></div></div>${difficultySelect(i,'wallDifficulty','Decking labor difficulty')}<h3>Railings, trim and stairs</h3><div class="row"><div><label>Railing length (LF)</label><input type="number" min="0" step="any" value="${esc(r.deckRailLf??0)}" oninput="updateSurface(${i},'deckRailLf',this.value)"></div><div><label>Balusters / spindles (count)</label><input type="number" min="0" step="1" value="${esc(r.deckBalusters??0)}" oninput="updateSurface(${i},'deckBalusters',this.value)"></div></div><div class="row"><div><label>Posts (count)</label><input type="number" min="0" step="1" value="${esc(r.deckPosts??0)}" oninput="updateSurface(${i},'deckPosts',this.value)"></div><div><label>Fascia length (LF)</label><input type="number" min="0" step="any" value="${esc(r.deckFasciaLf??0)}" oninput="updateSurface(${i},'deckFasciaLf',this.value)"></div></div><div class="row"><div><label>Stair treads (count)</label><input type="number" min="0" step="1" value="${esc(r.deckTreads??0)}" oninput="updateSurface(${i},'deckTreads',this.value)"></div><div><label>Stair risers (count)</label><input type="number" min="0" step="1" value="${esc(r.deckRisers??0)}" oninput="updateSurface(${i},'deckRisers',this.value)"></div></div><div class="row"><div><label>Stringers (count)</label><input type="number" min="0" step="1" value="${esc(r.deckStringers??0)}" oninput="updateSurface(${i},'deckStringers',this.value)"></div><div><label>Deck height above ground (ft)</label><input type="number" min="0" step="any" value="${esc(r.deckHeight??0)}" oninput="updateSurface(${i},'deckHeight',this.value)"></div></div><label>Existing coating and condition</label><select onchange="updateSurface(${i},'surfaceCondition',this.value)">${['','Good','Weathered','Peeling stain/paint','Heavy mildew/dirt','Wood repair needed','Other'].map(v=>`<option value="${esc(v)}" ${r.surfaceCondition===v?'selected':''}>${esc(v||'Select condition')}</option>`).join('')}</select><label>Prep and scope notes</label><textarea oninput="updateSurface(${i},'scope',this.value)">${esc(r.scope||'')}</textarea><p id="area-${i}"><strong>Decking area: ${area(r).toFixed(1)} sq ft</strong></p><p><small>Railing, baluster, post, fascia, and stair pricing is not yet automatic and is flagged in review until those production rates are established.</small></p><button class="secondary" onclick="d.rooms.splice(${i},1);save();render()">Remove deck section</button></div>`).join('');
}
function exteriorScreen(){
 let h='<div class="card"><h2>Exterior measurements</h2><p>Walk clockwise around the building: front, right, rear, left. Record wall length and wall height for each elevation. Subtract openings only if their area is not being painted.</p><div class="actions"><button onclick="addExteriorTemplate()">+ Add four elevations</button><button class="secondary" onclick="addExteriorSurface(\'Elevation\')">+ Additional elevation</button><button class="secondary" onclick="addExteriorSurface(\'Gable\')">+ Gable</button><button class="secondary" onclick="addExteriorSurface(\'Dormer\')">+ Dormer</button><button class="secondary" onclick="addExteriorSurface(\'GarageDoor\')">+ Garage door</button><button class="secondary" onclick="addExteriorSurface(\'Soffit\')">+ Soffit / porch ceiling</button><button class="secondary" onclick="addExteriorSurface(\'OtherExterior\')">+ Other surface</button></div><p><small>Gables can use base × rise / 2 or three measured sides. Soffits use length × depth. Record eave/soffit depth (wall to roof edge) and length (along house), plus fascia and gutters, without double-counting. Eave and fascia dimensions below are inspection-only; separate pricing still requires review.</small></p></div>';
 return h+d.rooms.map((r,i)=>{
 const gable=r.kind==='Gable',soffit=r.kind==='Soffit',other=r.kind==='OtherExterior',garage=r.kind==='GarageDoor',dormer=r.kind==='Dormer';
 const lengthLabel=gable?'Gable base width (ft)':garage?'Garage door width (ft)':dormer?'Dormer face width (ft)':soffit?'Soffit / ceiling length (ft)':other?'Paintable surface length (ft)':'Wall length (ft)';

function report(){let c=calc();return `LAKE PAINTERS — INTERNAL FIELD INSPECTION\nCustomer: ${d.customer}\nPhone: ${d.phone}\nEmail: ${d.email}\nAddress: ${d.address}\nGate code: ${d.gateCode||''}\nDoor code: ${d.doorCode||''}\nProject: ${d.project}\nRoute: ${d.route}\n\nSURFACES\n${d.rooms.map((r,i)=>`${i+1}. ${r.name||r.kind}: ${area(r).toFixed(1)} sq ft, ${r.coats} coats, ${r.trim||0} LF trim${r.trimWidth?`, ${r.trimWidth} in wide`:''}; ${r.doorSides||0} door sides. ${r.scope||''}; difficulty: wall ${r.wallDifficulty||1}x, soffit ${r.eaveDifficulty||1}x, fascia ${r.fasciaDifficulty??d.roofEdgeDifficulty??1}x, gutters ${r.gutterDifficulty??d.roofEdgeDifficulty??1}x`).join('\n')}\n\nEXTERIOR ROOF EDGE DETAILS (LABOR RATES PROVISIONAL)\n${d.project==='Exterior'?d.rooms.map(r=>`${r.name||r.kind}: soffit ${r.eaveLength||0} ft × ${r.eaveDepth||0} in = ${eaveArea(r).toFixed(1)} sq ft; fascia ${r.fasciaLength||0} ft × ${r.fasciaHeight||0} in; gutters ${r.gutters||'not recorded'}, ${r.gutterSize||'unknown'} in × ${r.gutterLength||0} ft; paint gutters ${r.paintGutters||'not recorded'}`).join('\n'):'Not applicable'}\n\nEXTERIOR FEATURES (SOME MEASUREMENTS NOT YET PRICED)\n${d.project==='Exterior'?d.rooms.map(r=>`${r.name||r.kind}: siding ${r.sidingType||'not selected'}; condition ${r.surfaceCondition||'not selected'}; garage ${r.garageType||'not selected'}; entry doors ${r.entryDoorCount||0} (painted sides listed above); windows ${r.windowCount||0}; shutters ${r.shutterCount||0}; porch columns ${r.columnCount||0}, ${r.columnHeight||0} ft tall × ${r.columnWidth||0} in; porch ceiling ${r.porchCeilingLength||0} × ${r.porchCeilingWidth||0} ft; railing ${r.porchRailing||0} LF; access height ${r.accessHeight||0} ft`).join('\n'):'Not applicable'}\n\nEXTERIOR CLEANING / ACCESS\n${d.project==='Exterior'?`Wash: ${d.pressureWashing||'not selected'}; area ${d.washingArea||0} sq ft; method ${d.washingMethod||'not selected'}; working height ${d.exteriorWorkHeight||0} ft. Access: ${d.accessEquipment||'not selected'}, ladder ${d.ladderSize||'not selected'} ${d.ladderFeet||''} ft. Prep: ${(d.exteriorPrepChecklist||[]).join(', ')}. Notes: ${d.accessNotes||''}`:'Not applicable'}\n\nADDITIONAL TASKS\n${d.repairs.map(r=>`${r.name}: qty ${r.qty}, ${r.hours} additional hours, ${r.include?'separate':'included'}`).join('\n')}\n\nFIELD NOTES\n${d.notes}\n\nPRELIMINARY INTERNAL PRICING\nWall area ${c.area.toFixed(1)} sq ft; estimated labor ${c.hours.toFixed(1)} hours; paint ${c.gallons.toFixed(1)} gallons; trim ${c.trim.toFixed(1)} LF; trim charge ${money(c.trimTotal)} (reference ${d.trimReferenceWidth||4} inches at ${money(+d.trimPrice||0)}/LF for two coats; width and coats adjusted).\nPaint brand: ${d.paintBrand||'Sherwin-Williams'}\nPaint use: ${d.paintUse||'Interior'}\nSheen: ${d.paintSheen||'Not specified'}\nPaint product: ${d.paintProduct||'Not specified'}\nApplication method: ${d.applicationMethod||'Brush and roll'}${d.applicationMethod==='Combination'?` (${d.sprayPercent||0}% sprayed)`:''}; brush/roll coverage ${d.paintCoverage||300} sq ft/gal/coat; spray coverage ${d.sprayCoverage||225} sq ft/gal/coat\nVerified SKU: ${d.paintSku||'Not entered'}\nContainer size: ${d.paintSize||'Not specified'}\nLabor hours: walls ${c.wallHours.toFixed(2)}, soffits ${c.soffitHours.toFixed(2)}, fascia ${c.fasciaHours.toFixed(2)}, gutters ${c.gutterHours.toFixed(2)}, shutters ${c.shutterHours.toFixed(2)}, columns ${c.columnHours.toFixed(2)}, porch ceilings ${c.porchHours.toFixed(2)}, railings ${c.railingHours.toFixed(2)}, garage doors ${c.garageDoorHours.toFixed(2)}, trim ${c.trimHours.toFixed(2)}, doors ${c.doorHours.toFixed(2)}, prep ${c.prepHours.toFixed(2)}; total ${c.hours.toFixed(2)} hours at ${money(+d.laborRate||90)}/hr. Unpriced exterior components: ${c.unpriced.join(', ')||'none'}.\nTotal labor: ${money(c.laborTotal)}\nTrim charge: ${money(c.trimTotal)}\nDoors: ${c.doorSides} sides at ${money(+d.doorSidePrice||0)}/side = ${money(c.doorTotal)}\nPaint purchase cost: ${money(c.paintCostTotal)}\nSundry materials:\n${d.sundries.map(item=>`- ${item.name}: ${item.qty||0} at ${money(Math.max(0,+item.unitCost||0))} each = ${money(Math.max(0,+item.qty||0)*Math.max(0,+item.unitCost||0))}`).join('\n')}\nSundry materials purchase total: ${money(c.sundryCostTotal)}\nEquipment direct costs: ${money(c.equipmentCostTotal)}; additional equipment labor ${c.equipmentHours.toFixed(2)} hours (included in labor total)\nMaterial multiplier: ${d.markup} (markup on paint and sundries)\nMaterials after multiplier: ${money(c.materialsTotal)}\nSuggested price: ${money(c.price)}\nAmy's final price: ${d.finalPrice?money(+d.finalPrice):'Pending review'}\n\nPhotos: ${d.photos.length} attached in app. Verify all scope and pricing before sending to customer.`}
function updateSurface(i,k,v){d.rooms[i][k]=v;save();let e=$('area-'+i);if(e)e.innerHTML='<strong>Net paintable area: '+area(d.rooms[i]).toFixed(1)+' sq ft</strong>'+(areaProblem(d.rooms[i])?'<br><strong class="notice">'+esc(areaProblem(d.rooms[i]))+'</strong>':'');let ea=$('eave-area-'+i);if(ea)ea.innerHTML='<strong>Measured soffit area: '+eaveArea(d.rooms[i]).toFixed(1)+' sq ft (not yet included in preliminary pricing)</strong>'}
function toggleExteriorPrep(name,on){const set=new Set(d.exteriorPrepChecklist||[]);if(on)set.add(name);else set.delete(name);d.exteriorPrepChecklist=[...set];save()}
function updateRepair(i,k,v){d.repairs[i][k]=v;save()}
function addSurface(kind){d.rooms.push({kind,name:'',length:'',width:'',height:'',deduct:0,coats:2,trim:0,trimWidth:'',doorSides:0,scope:''});save();render()}
function move(n){if(step===steps.length-1&&n===1){if(!confirm('Start a new inspection? Export a backup first. This will replace the locally saved inspection.'))return;d=empty();step=0;save();render();return}step=Math.max(0,Math.min(steps.length-1,step+n));save();render();window.scrollTo(0,0)}
function save(){try{localStorage.setItem('lp-v1',JSON.stringify(d));localStorage.setItem('lp-step',step)}catch(e){alert('Browser storage is full. Export your inspection backup and reduce photos.')} }
function download(name,data,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function exportJSON(){download('lake-painters-inspection-backup.json',JSON.stringify(d,null,2),'application/json')}
function importJSON(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.rooms)||!Array.isArray(obj.repairs))throw Error('Invalid format');d={...empty(),...obj};step=0;save();render()}catch{alert('Could not read inspection backup')}};reader.readAsText(f)}
function customerReport(){return `LAKE PAINTERS — DRAFT PROJECT SCOPE\nCustomer: ${d.customer}\nProperty: ${d.address}\nProject: ${d.project}\n\nPROPOSED WORK (SUBJECT TO REVIEW)\n${d.rooms.map((r,i)=>`${i+1}. ${r.name||r.kind}: ${area(r).toFixed(1)} sq ft, ${r.coats} coats, ${r.doorSides||0} door sides. ${r.scope||''}`).join('\n')}\n\nADDITIONAL WORK TO REVIEW\n${d.repairs.map(r=>`${r.name}: ${r.qty}`).join('\n')}\n\nFinal scope and pricing require Lake Painters approval.`}
function downloadCustomerReport(){download('lake-painters-customer-scope-DRAFT.txt',customerReport(),'text/plain')}
function downloadReport(){download('lake-painters-INTERNAL-inspection.txt',report(),'text/plain')}
async function shareReport(){let blob=new Blob([report()],{type:'text/plain'});let file=new File([blob],'lake-painters-inspection.txt',{type:'text/plain'});try{if(navigator.canShare?.({files:[file]}))await navigator.share({files:[file],title:'Lake Painters inspection'});else if(navigator.share)await navigator.share({title:'Lake Painters inspection',text:report()});else downloadReport()}catch(e){if(e.name!=='AbortError')downloadReport()}}
function addPhotos(e){[...e.target.files].forEach(f=>{let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,1000/Math.max(im.width,im.height));cv.width=im.width*scale;cv.height=im.height*scale;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);d.photos.push({caption:f.name,data:cv.toDataURL('image/jpeg',.65)});save();render()};im.src=reader.result};reader.readAsDataURL(f)})}
try{step=Math.min(5,Math.max(0,+localStorage.getItem('lp-step')||0));if(!localStorage.getItem('lp-step-seven-page-v1')){if(step>=3)step++;localStorage.setItem('lp-step-seven-page-v1','1');localStorage.setItem('lp-step',step)}}catch{}render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
